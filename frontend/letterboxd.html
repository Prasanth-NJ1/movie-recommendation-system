<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letterboxd Recommendation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
   

    <!-- Home Button -->
    <div class="title-container">
        <h1 class="title">Letterboxd
        </h1>
        <button class="home-button" onclick="location.href='index.html'">Home</button>
    </div>

    <div class="form-container">
        <input type="text" id="letterboxd-input" placeholder="Enter your Letterboxd username">
        <button onclick="getLetterboxdRecommendations()">Submit</button>
    </div>

    <div id="results"></div>

    <script src="script.js"></script>

    <script>
        // Trigger function on "Enter" key press
        document.getElementById("letterboxd-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault(); // Prevent default form submission
                getLetterboxdRecommendations();
            }
        });
    </script>
</body>
</html>
