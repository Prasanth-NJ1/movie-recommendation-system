<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letterboxd Recommendation</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
   

    <div class="title-container">
        <!-- Home button on the left -->
        <a href="index.html" class="home-button">
            <img src="assets/images/home-button.png" alt="Home" class="home-button-image">
        </a>   
    
        <!-- Title in the center -->
        <h1 class="title">Letterboxd</h1>
    </div>
    
    <div class="form-container">
        <input type="text" id="letterboxd-input" placeholder="Enter your Letterboxd username">
        <button onclick="getLetterboxdRecommendations()">Submit</button>
    </div>
    <div id="loading" style="display: none;">Loading... Please wait.</div>
    <div id="results"></div> 
    <div id="pagination-container"></div>
    <script src="script.js"></script>

    <script>
        // Trigger function on "Enter" key press
        document.getElementById("letterboxd-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault(); // Prevent default form submission
                getLetterboxdRecommendations();
            }
        });
    </script>
</body>
</html>
