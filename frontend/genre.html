<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genre Recommendation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="title-container">
        <h1 class="title">Genre-based</h1>
        <button class="home-button" onclick="location.href='index.html'">Home</button>
    </div>
    
    <div class="form-container">
        <input type="text" id="genre-input" placeholder="Enter genre (e.g., Action, Drama)">
        <button onclick="getGenreRecommendations()">Submit</button>
    </div>
    <div id="results"></div>
    <script src="script.js"></script>

    <script>
        document.getElementById("genre-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                getGenreRecommendations();
            }
        });
    </script>
</body>
</html>
