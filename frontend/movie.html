<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie-Based Recommendation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Title and Home Button Container -->
    <div class="title-container">
        <h1 class="title">Movie-Based</h1>
        <button class="home-button" onclick="location.href='index.html'">Home</button>
    </div>

    <!-- Input Form -->
    <div class="form-container">
        <input type="text" id="movie-input" placeholder="Enter a movie name">
        <button onclick="getMovieRecommendations()">Submit</button>
    </div>

    <div id="results"></div>

    <script src="script.js"></script>

    <script>
        // Trigger function on "Enter" key press
        document.getElementById("movie-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault(); // Prevent default form submission
                getMovieRecommendations();
            }
        });
    </script>
</body>
</html>
